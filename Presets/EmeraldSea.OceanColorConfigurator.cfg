## Power shaping the shallow-to-deep transition. Higher values concentrate shallow coloring nearer the surface. Auto restores the ocean material's previous value. Uncheck Auto to adjust the slider; use -/+ for fine adjustments. Range: 0.01 to 10. Auto follows the game. Config files still accept Auto or a decimal value.
# Setting type: String
# Default value: Auto
Shallow Depth Falloff = Auto

