# Setting type: String
# Default value: Auto
Shallow Water Shadow Color = Auto

## Depth in metres over which shallow coloring fades into deeper water. Lower values confine the color to shallower areas; this is not distance from shore. Auto restores the ocean material's previous value. Uncheck Auto to adjust the slider; use -/+ for fine adjustments. Range: 0.01 to 50. Auto follows the game. Config files still accept Auto or a decimal value.
