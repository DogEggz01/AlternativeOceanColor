## Settings file was created by plugin Ocean Color Configurator v1.7.0
## Plugin GUID: DogEggz.OceanColorConfigurator

[1 - General]

## Master switch for color, grading, dawn-profile, and ocean-material overrides. Disabling it restores ocean-material settings without erasing configured values.
# Setting type: Boolean
# Default value: true
Enable Color Overrides = true

## Use sections 2, 3, 4, 7, and 10 as daytime settings, blending into the game's dawn/dusk and night palettes. Enabled Clear/Cloudy Dawn profiles replace their dawn endpoints. Shallow and reflection colors fade back to the original material at twilight/night; depth and scattering-strength sliders stay fixed. Turn off to keep configured values at every time within the scope selected by Follow Weather.
# Setting type: Boolean
# Default value: true
Follow Time of Day = true

## Use sections 2, 3, 4, 7, and 10 for clear weather, blending back to the game's cloudy, rain, and storm palettes. Works with Follow Time of Day. Enabled dawn profiles still customize their weather's twilight. Shallow and reflection colors also fade with cloud cover; depth and scattering-strength sliders stay fixed. Turn off to use your colors in all weather.
# Setting type: Boolean
# Default value: true
Follow Weather = true

[10 - Ocean Reflections]

## Base color of the ocean's built-in sky reflections. Separate from the visible Sky Tint. Requires the ocean material's procedural reflection sky, enabled in vanilla Sailwind. Follows Follow Weather and Follow Time of Day. Auto restores the ocean material's previous value. Enter Auto, #RRGGBB, RRGGBB, 0xRRGGBB, or three 0-255 RGB channels separated by commas, spaces, or semicolons.
# Setting type: String
# Default value: Auto
Reflection Base Color = Auto

## Ocean reflection color toward the sun. The vanilla color can be brighter than white (HDR); a hex override uses ordinary 0-1 RGB, and Auto restores the original HDR value. Follows Follow Weather and Follow Time of Day. Auto restores the ocean material's previous value. Enter Auto, #RRGGBB, RRGGBB, 0xRRGGBB, or three 0-255 RGB channels separated by commas, spaces, or semicolons.
# Setting type: String
# Default value: Auto
Reflection Toward Sun Color = #ABD5EF

## Ocean reflection color away from the sun. Separate from Sun Color and subsurface scattering. Follows Follow Weather and Follow Time of Day. Auto restores the ocean material's previous value. Enter Auto, #RRGGBB, RRGGBB, 0xRRGGBB, or three 0-255 RGB channels separated by commas, spaces, or semicolons.
# Setting type: String
# Default value: Auto
Reflection Away From Sun Color = #4A7E8C

## Intensity of the direct sun highlight on the ocean, separate from Sun Scattering Strength. Compare 0 with Auto while looking toward the sun. Requires the existing directional-light shader feature. Follows Follow Weather and Follow Time of Day. Auto restores the ocean material's previous value. Uncheck Auto to adjust the slider; use -/+ for fine adjustments. Range: 0 to 512. Auto follows the game. Config files still accept Auto or a decimal value.
# Setting type: String
# Default value: Auto
Sun Highlight Strength = Auto

## Shapes reflection strength with viewing angle. Higher values concentrate reflection nearer grazing angles; lower values spread reflection over more angles. Can also affect underwater reflections. Follows Follow Weather and Follow Time of Day. Auto restores the ocean material's previous value. Uncheck Auto to adjust the slider; use -/+ for fine adjustments. Range: 1 to 20. Auto follows the game. Config files still accept Auto or a decimal value.
# Setting type: String
# Default value: Auto
Reflection Fresnel Power = Auto

## Strength of the ocean's specular lighting response. Lower values reduce the reflective surface contribution. Follows the same clear-weather and daytime scope as the ocean colors; Auto retains the game's region/weather/time value. Uncheck Auto to adjust the slider; use -/+ for fine adjustments. Range: 0 to 1. Auto follows the game. Config files still accept Auto or a decimal value.
# Setting type: String
# Default value: Auto
Specular Strength = 0.4

